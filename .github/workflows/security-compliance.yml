name: Copilot security policy

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: security-standards-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  COPILOT_MODEL: ${{ vars.COPILOT_MODEL }}

jobs:
  review:
    name: Organization Security Standard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      # Keep admission inline: no repository scripts run before trusted checkout.
      # Same-repository origin alone is no security guarantee. Fail forks, not skip.
      - name: Require a same-repository PR
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "This demo only reviews trusted same-repository PRs." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Scripts and policy are base-owned; proposed PR changes cannot review themselves.
      - name: Check out the trusted base, not PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load policy and PR changes as text
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/security-pr.sh prepare

      - name: Install official Copilot CLI
        run: npm install --global @github/copilot@1.0.109

      - name: Review with Copilot
        working-directory: ${{ runner.temp }}
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/copilot-review.sh" pr

      - name: Show findings and set the job verdict
        working-directory: ${{ runner.temp }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/security-pr.sh" report
