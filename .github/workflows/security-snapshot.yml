name: Copilot Security Bot

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-snapshot-main
  cancel-in-progress: false

env:
  COPILOT_MODEL: ${{ vars.COPILOT_MODEL }}

jobs:
  audit:
    name: Main Security Snapshot Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Require the trusted main workflow
        id: trust
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" &&
             "$WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/security-snapshot.yml@refs/heads/main" &&
             ("$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch") ]]

      - name: Resolve current main once
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false

      # Only trusted automation from this pinned main checkout runs. Reviewed
      # files are read as Git objects, never executed or installed as dependencies.
      - name: Prepare the complete pinned snapshot
        id: prepare
        run: python3 .github/scripts/security-snapshot.py prepare

      - name: Install official Copilot CLI
        id: install
        timeout-minutes: 2
        run: npm install --global @github/copilot@1.0.109

      - name: Review with Copilot
        id: review
        working-directory: ${{ runner.temp }}
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/copilot-review.sh" snapshot

      - name: Publish summary and set the audit verdict
        if: always()
        env:
          TRUST_OUTCOME: ${{ steps.trust.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
        # Always report early failures without executing an untrusted/stale script.
        run: |
          if [[ "$TRUST_OUTCOME" != success || "$CHECKOUT_OUTCOME" != success ]]; then
            echo "## Main Security Snapshot Audit" >> "$GITHUB_STEP_SUMMARY"
            echo "**ERROR**: Trusted-main validation or checkout failed; credentialed review did not run." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 .github/scripts/security-snapshot.py report
